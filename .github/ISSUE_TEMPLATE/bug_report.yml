name: Bug report
description: A bug, crash or graphics problem in the test build
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The more precise the details, the faster the bug can be found.
        Please report only one bug per issue. English or German are both fine.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown bottom right in the main menu, e.g. v2026.10.04.1128-68aba1d
      placeholder: v2026.10.04.1128-68aba1d
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Submarine (hub)
        - Temple Forecourt
        - Drilling Station
        - Coral Cathedral
        - Sunken Archives
        - The Abyss
        - Main menu / Settings
        - Not sure
    validations:
      required: true
  - type: input
    id: depth
    attributes:
      label: Depth / Room
      description: Shown top left in the HUD, e.g. “Depth 6 · Room 2/5” or “Boss arena”
      placeholder: Depth 6 · Room 2/5
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the bug happened?
      placeholder: |
        1. Started a run with …
        2. Entered the room … at depth …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead? For crashes, please also say whether the game froze or closed.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Once
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Drag an image or a short video in here (optional, but very helpful).
  - type: input
    id: system
    attributes:
      label: System (optional)
      description: Graphics card, Windows version, resolution
      placeholder: Windows 11, 2560×1440
